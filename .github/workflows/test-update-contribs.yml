name: Update Contribs & reviewers

on:
  workflow_dispatch:
  schedule:
    # Runs on the 1 and 15 of each month at 00:00 UTC (see https://crontab.guru)
    - cron: "0 0 1,15 * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-meta:
    name: Update contributor and review data
    if: github.repository_owner == 'pyopensci'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create-pull-request writes back to repo
      pull-requests: write     # create-pull-request opens a PR
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          # install pip=>20.1 to use "pip cache dir"
          python -m pip install --upgrade pip wheel

      - name: Install pyosMeta and run update contribs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install dev version
          python -m pip install .
          update-contributors
          update-reviews
          update-review-teams

      - name: Update editorial board
        env:
          GITHUB_TOKEN: ${{ secrets.PYOS_READ_TEAM_MEMBERS_SECRET }}
        run: |
          update-editorial-board

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            data/contributors.yml
            data/packages.yml
            data/editorial-board.yml
            data/emeritus-editors.yml
          author: Leah <leah@pyopensci.org>
          base: main
          branch: contribs
          commit-message: "Update: Contributor & review file update"
          delete-branch: true
          title: Update contributor and review data
          labels: |
            pre-commit.ci autofix
        env:
          # Custom token needed to trigger PR checks
          # https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs
          token: ${{ secrets.PYOS_PR_TOKEN }}

