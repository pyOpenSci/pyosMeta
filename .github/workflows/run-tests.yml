name: Run pyos meta tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Runs on Mon and Thu of each week at 00:00 UTC (see https://crontab.guru)
    - cron: "0 0 * * 1,4"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test pyosMeta
    runs-on: ubuntu-latest
    permissions:
      contents: read           # read repo for checkout
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install Hatch
        run: pipx install hatch

      - name: Run tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: hatch run test:run-report

      - name: Run CLIs against website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          pip install -e .
          git clone https://github.com/pyOpenSci/pyopensci.github.io.git
          cd pyopensci.github.io
          update-contributors
          update-reviews
          update-review-teams

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354  # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          files: ./coverage.xml
